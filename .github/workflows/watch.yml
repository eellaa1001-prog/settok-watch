name: settok-watch
on:
  schedule:
    # 시간은 UTC. 한국시간 매일 16:00~23:59, 07:00~08:59 (평일 9~16시는 PC가 켜져 있음)
    - cron: "*/10 7-14,22-23 * * *"
    # 한국시간 토·일 09:00~15:59
    - cron: "*/10 0-6 * * 0,6"
  workflow_dispatch:
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: python3 watch.py
        env:
          SETTOK_KEY: ${{ secrets.SETTOK_KEY }}
          ROUTINE_TOKEN: ${{ secrets.ROUTINE_TOKEN }}

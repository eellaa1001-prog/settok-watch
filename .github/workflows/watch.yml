name: settok-watch
on:
  schedule:
    # 시간은 UTC (한국시간 = UTC+9). 평일 9~16시는 PC가 켜져 있어서 뺌
    - cron: "*/5 7-14 * * 1-5"    # 평일 16:00~23:59
    - cron: "*/5 22-23 * * 0-4"   # 평일 07:00~08:59
    - cron: "*/5 15-23 * * 5"     # 토요일 00:00~08:59
    - cron: "*/5 * * * 6"         # 토요일 09:00 ~ 일요일 08:59
    - cron: "*/5 0-14 * * 0"      # 일요일 09:00~23:59
  workflow_dispatch:
concurrency:
  group: settok-watch
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: python3 watch.py
        env:
          SETTOK_KEY: ${{ secrets.SETTOK_KEY }}
          ROUTINE_TOKEN: ${{ secrets.ROUTINE_TOKEN }}
